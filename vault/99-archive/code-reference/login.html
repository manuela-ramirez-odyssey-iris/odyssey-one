<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Odyssey ONE — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* =========================================================================
       Odyssey Design System Tokens (from design.md)
       ========================================================================= */

    :root {
      /* Primitives */
      --deep-sea-neutral-50:  #F7F8FA;
      --deep-sea-neutral-200: #E4E6EB;
      --deep-sea-neutral-300: #D0D4DB;
      --deep-sea-neutral-500: #6B7280;
      --deep-sea-neutral-700: #384253;
      --deep-sea-neutral-900: #1B2537;
      --white:                #FFFFFF;
      --carolina-blue-400:    #5BA4D4;

      /* Semantic — Text */
      --text-primary:    var(--deep-sea-neutral-900);
      --text-secondary:  var(--deep-sea-neutral-700);
      --text-tertiary:   var(--deep-sea-neutral-500);
      --text-inverse:    var(--white);

      /* Semantic — Background */
      --bg-primary:   var(--white);
      --bg-secondary: var(--deep-sea-neutral-50);

      /* Semantic — Border */
      --border-default: var(--deep-sea-neutral-300);
      --border-focus:   var(--carolina-blue-400);

      /* Component — Button */
      --btn-primary-bg:       var(--deep-sea-neutral-900);
      --btn-primary-text:     var(--white);
      --btn-secondary-bg:     var(--white);
      --btn-secondary-border: var(--deep-sea-neutral-300);
      --btn-secondary-text:   var(--deep-sea-neutral-700);
      --btn-primary-hover:    var(--deep-sea-neutral-700);

      /* Border Radius */
      --radius-lg: 8px;
      --radius-xl: 16px;

      /* Shadows */
      --shadow-sm:    0px 1px 2px 0px rgba(0, 0, 0, 0.05);
      --shadow-modal: 0px 8px 32px 0px rgba(0, 0, 0, 0.12);

      /* Typography */
      --font-primary: 'Inter', sans-serif;
    }

    /* =========================================================================
       Reset & Base
       ========================================================================= */

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: var(--font-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* =========================================================================
       Page Layout
       ========================================================================= */

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: relative;
      background: url('./bg.webp') center / cover no-repeat fixed;
    }

    /* Dark overlay — deep-sea-neutral/900 (#1B2537) at 55% alpha */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(27, 37, 55, 0.55);
      z-index: 0;
    }

    body > * {
      position: relative;
      z-index: 1;
    }

    /* =========================================================================
       Login Card (Modal)
       ========================================================================= */

    .login-card {
      width: 416px;
      padding: 32px;
      background: var(--bg-primary);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-modal);
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    /* Logo */
    .login-logo {
      display: flex;
      justify-content: center;
      padding-top: 7px;
    }

    /* Header */
    .login-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
    }

    .login-title {
      font-size: 20px;
      font-weight: 600;
      line-height: 28px;
      letter-spacing: -0.4px;
      color: var(--text-primary);
    }

    .login-subtitle {
      font-size: 16px;
      font-weight: 400;
      line-height: 24px;
      letter-spacing: -0.4px;
      text-wrap: pretty;
      color: var(--text-tertiary);
    }

    /* Buttons */
    .login-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      font-family: var(--font-primary);
      text-decoration: none;
      cursor: pointer;
    }

    .btn:focus-visible {
      outline: 2px solid var(--border-focus);
      outline-offset: 2px;
    }

    .btn-primary {
      background: var(--btn-primary-bg);
      border: 1px solid var(--btn-primary-bg);
      color: var(--btn-primary-text);
      font-size: 16px;
      font-weight: 500;
      line-height: 24px;
      padding: 8px 18px;
    }

    .btn-primary:hover {
      background: var(--btn-primary-hover);
      border-color: var(--btn-primary-hover);
    }

    .btn-primary:active {
      transform: scale(0.98);
      box-shadow: inset 0 1px 3px var(--shadow-sm);
    }

    .btn-secondary {
      background: var(--btn-secondary-bg);
      border: 1px solid var(--btn-secondary-border);
      color: var(--btn-secondary-text);
      font-size: 14px;
      font-weight: 500;
      line-height: 20px;
      padding: 8px 18px;
    }

    .btn-secondary:hover {
      background: var(--bg-secondary);
    }

    .btn-secondary:active {
      transform: scale(0.98);
      background: var(--deep-sea-neutral-200);
      box-shadow: inset 0 1px 3px var(--shadow-sm);
    }

    /* =========================================================================
       Copyright Footer
       ========================================================================= */

    .copyright {
      position: fixed;
      bottom: 16px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      font-weight: 400;
      line-height: 16px;
      color: var(--deep-sea-neutral-300);
    }
  </style>
</head>
